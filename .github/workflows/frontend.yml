name: Frontend

on:
  push:
    paths:
      - ".github/workflows/frontend.yml"
      - "apps/frontend/**"

defaults:
  run:
    working-directory: apps/frontend

jobs:
  build:
    name: Frontend - build and push docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      contents: read
      actions: read 
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: use dev config and dev favicon
        if: github.ref == 'refs/heads/master'
        run: |
          cp ./public/faviconDev.ico ./public/favicon.ico

      - name: use prod config and prod favicon
        if: github.ref == 'refs/heads/prod'
        run: |
          cp .env.prod .env
          cp ./public/faviconProd.ico ./public/favicon.ico
      
      - name: add version
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: echo "REACT_APP_GIT_VERSION=${GITHUB_SHA}" >> .env

      - name: Test
        run: yarn run test

      - name: Build and push
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/master'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: teamdatajegerne
          push_image: true
          image_suffix: frontend
          docker_context: ./apps/frontend
          
          
  deploy-dev-gcp:
    name: Frontend - deploy Dev GCP
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read 
    steps:
      - uses: actions/checkout@v7
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/frontend/nais/frontend-gcp.yaml
          VARS: apps/frontend/nais/frontend-dev-gcp-vars.yaml
          ENVIRONMENT: dev-gcp:teamdatajegerne:behandlingskatalog-frontend
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}

  deploy-prod-gcp:
    name: Frontend - deploy Prod GCP
    needs: build
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read 
    steps:
      - uses: actions/checkout@v7
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/frontend/nais/frontend-gcp.yaml
          VARS: apps/frontend/nais/frontend-prod-gcp-vars.yaml
          ENVIRONMENT: prod-gcp:teamdatajegerne:behandlingskatalog-frontend
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
